<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centered Image</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    img {
      width: 430px;
      height: 430px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <img src="https://t2.genius.com/unsafe/430x430/https%3A%2F%2Fimages.genius.com%2Ff79abb3ea538e28d197815e86650a695.1000x1000x1.png" alt="Centered Image" />
</body>
</html>
